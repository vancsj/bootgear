name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit has a Signed-off-by matching its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format='%ae' "$sha")
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                | grep -qiF "<$email>"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") — missing 'Signed-off-by: ... <$email>'"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Add sign-offs with: git rebase --signoff $BASE && git push --force-with-lease"
            echo "See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits signed off."
