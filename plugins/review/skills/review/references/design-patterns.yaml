# Architecture find angles. Use cost for the change or failure the design makes harder.
# Cut a design claim without an observed cost scenario.

- id: layer-leak
  tag: find
  lens: architecture
  tell: A controller or UI calls the repository or database, or domain code imports a framework or transport.
  asks: "Does a layer bypass the one below it?"
  cost: Swapping the store or transport touches domain code.
- id: wrong-owner
  tag: find
  lens: architecture
  tell: "The change adds logic outside the place that holds its data."
  asks: Does the rule belong with the data it reads?
  cost: "The next caller duplicates the rule."
- id: hidden-coupling
  tag: find
  lens: architecture
  tell: Two parts share a table, file, environment variable or string key.
  asks: Which other part silently depends on the shared name?
  cost: A rename breaks the other part silently.
- id: circular-dependency
  tag: find
  lens: architecture
  tell: A new import points back into a caller.
  asks: "Does the dependency graph now have a cycle?"
  cost: "Tests or deployments cannot isolate the parts."
- id: shotgun-change
  tag: find
  lens: architecture
  tell: "One concept changes in five or more files."
  asks: "Do separate copies of one concept need changes together?"
  cost: The next change misses a copy.
- id: feature-envy
  tag: find
  lens: architecture
  tell: "A call reaches through objects, for example `a.b().c().d()`."
  asks: "Does the caller rely on internals of objects it does not own?"
  cost: A change inside `b` breaks distant callers.

# Abstraction
- id: premature-abstraction
  tag: find
  lens: architecture
  tell: An interface, factory or strategy has one implementation.
  asks: Does the abstraction serve more than one real case?
  cost: Every change edits three layers.
- id: wrong-abstraction
  tag: find
  lens: architecture
  tell: A shared helper grows flags or `if type ==` branches.
  asks: Do the callers actually share one behavior?
  cost: Each caller adds another parameter.
- id: missing-abstraction
  tag: find
  lens: architecture
  tell: Five or more lines are copied with small differences.
  asks: Should the copies be one unit?
  cost: A fix lands in one copy only.
- id: god-object
  tag: find
  lens: architecture
  tell: A large class or file gains another responsibility.
  asks: Does the unit now own unrelated concerns?
  cost: Unrelated changes conflict.
- id: flag-parameters
  tag: find
  lens: architecture
  tell: "A call uses positional booleans, for example `doThing(x, true, false)`."
  asks: "Can the caller pass a wrong combination without noticing?"
  cost: "The caller passes a wrong combination."
- id: leaky-abstraction
  tag: find
  lens: architecture
  tell: "A caller needs internal details to use the unit."
  asks: "Can misuse still compile?"
  cost: Misuse compiles and fails at runtime.

# State and data
- id: two-sources-of-truth
  tag: find
  lens: architecture
  tell: "Two copies store or cache the same fact."
  asks: "Which copy wins if they disagree?"
  cost: "The copies diverge without detection."
- id: derived-data-stored
  tag: find
  lens: architecture
  tell: "Storage keeps a total or status with its inputs."
  asks: "What updates the stored value when an input changes?"
  cost: "An input change leaves a stale value."
- id: stringly-typed
  tag: find
  lens: architecture
  tell: A status or kind is a free string or magic value.
  asks: Does anything reject a value outside the known set?
  cost: A typo becomes a new state.
- id: invalid-states-representable
  tag: find
  lens: architecture
  tell: "Fields form nullable pairs, or `status` and `errorMsg` can coexist."
  asks: "Can the type hold a forbidden combination?"
  cost: "Code must handle impossible combinations."
- id: implicit-state-machine
  tag: find
  lens: architecture
  tell: "Separate `if` statements scatter state transitions."
  asks: "What enforces legal transitions?"
  cost: "Code can write an illegal transition."
- id: mutable-shared-state
  tag: find
  lens: architecture
  tell: Module globals or singletons hold mutable state.
  asks: Can two tests or requests see each other's writes?
  cost: Tests or requests interfere with each other.

# Contracts and interfaces
- id: unversioned-breaking-change
  tag: find
  lens: architecture
  tell: "A public API, schema, or event shape changes."
  asks: "Do existing clients work during deployment?"
  cost: "Deployment breaks clients."
- id: wide-interface
  tag: find
  lens: architecture
  tell: A method was added to a widely implemented interface.
  asks: How many implementers must now change?
  cost: Every implementer changes.
- id: temporal-coupling
  tag: find
  lens: architecture
  tell: One call must precede another, such as `init()` before `use()`.
  asks: What enforces the call order?
  cost: The wrong order fails at runtime.
- id: implied-output-shape
  tag: find
  lens: architecture
  tell: A caller parses prose or relies on field order.
  asks: Is the output shape stated anywhere the producer maintains?
  cost: A wording change breaks the consumer.
- id: inconsistent-error-contract
  tag: find
  lens: architecture
  tell: "One module mixes throwing, returning null, and returning error codes."
  asks: "Does each caller handle the form it receives?"
  cost: "Callers miss an error form."

# Failure handling
- id: swallowed-error
  tag: find
  lens: architecture
  tell: "A path uses an empty catch, logs and continues, or uses `|| true`."
  asks: "Can the caller or operator see the failure?"
  cost: "Failure looks like success."
- id: partial-write
  tag: find
  lens: architecture
  tell: A multi-step mutation has no transaction or up-front validation.
  asks: "What state remains if the process stops between steps?"
  cost: A crash leaves corrupt state.
- id: non-idempotent-retry
  tag: find
  lens: architecture
  tell: A retry wraps a side effect.
  asks: "Is the side effect safe to repeat?"
  cost: "The retry duplicates a charge, email, or row."
- id: no-timeout-backpressure
  tag: find
  lens: architecture
  tell: "Code adds a network or queue call."
  asks: What bounds the wait and the backlog?
  cost: "A slow dependency blocks other work."
- id: fallback-hides-failure
  tag: find
  lens: architecture
  tell: "An error path returns a default."
  asks: "Can the caller distinguish fallback from real data?"
  cost: "The caller receives wrong data without warning."

# Evolution and operation
- id: irreversible-migration
  tag: find
  lens: architecture
  tell: A destructive change has no down path.
  asks: Can the change be rolled back without losing data?
  cost: A rollback loses data.
- id: config-sprawl
  tag: find
  lens: architecture
  tell: A new flag or environment variable has no owner or removal plan.
  asks: "Who owns the setting? When can the owner remove it?"
  cost: "Tests miss setting combinations."
- id: hardcoded-environment
  tag: find
  lens: architecture
  tell: "Code embeds URLs, IDs, or paths."
  asks: Does the value differ between environments?
  cost: The code breaks in another environment.
- id: missing-observability
  tag: find
  lens: architecture
  tell: "A new path has no log or metric at decision points."
  asks: "Can operators diagnose a production failure on this path?"
  cost: "Operators cannot diagnose a production failure."
- id: hot-path-cost
  tag: find
  lens: architecture
  tell: I/O inside a loop, an N+1 query, or an unbounded load.
  asks: How does the cost grow with the data?
  cost: Performance degrades as data grows.

# Bad practice
- id: test-induced-design-damage
  tag: find
  lens: architecture
  tell: Production code gains test-only hooks or branches.
  asks: Does test-only code run in production?
  cost: Test branches run in production.
- id: tests-of-the-mock
  tag: find
  lens: architecture
  tell: A test only asserts that stubs were called.
  asks: "Would the test pass with a broken implementation?"
  cost: The test passes with a broken implementation.
- id: rationale-misplaced
  tag: find
  lens: architecture
  tell: "Code or instructions contain rationale."
  asks: "Does the rationale belong in a reference document?"
  cost: "Instructions grow and diverge."
- id: unverified-platform-claim
  tag: find
  lens: architecture
  tell: The design relies on assumed API or CLI behavior.
  asks: "Did someone verify the behavior against official docs or real output?"
  cost: "The design relies on absent behavior."
- id: dead-speculative-code
  tag: find
  lens: architecture
  tell: "Code has unused parameters or branches for future use."
  asks: "Does any current path use them?"
  cost: "Unused paths need maintenance."
- id: reinvented-wheel
  tag: find
  lens: architecture
  tell: "Code implements its own version of an existing utility or library."
  asks: "Does the existing implementation serve this case?"
  cost: "The implementations diverge."
