# Add these security angles to the general angles.

- id: ownership-check-missing
  tag: find
  lens: security
  tell: "Code reads, changes, or deletes by request ID. Or a state-changing path checks only sign-in."
  asks: "Does the path verify the requesting user or tenant can act on this object? Sign-in alone is insufficient."
- id: bulk-ownership
  tag: find
  lens: security
  tell: One request acts on a list of objects.
  asks: "Does the path check every item against the requester, including items after the first and inside containers?"
- id: url-from-response
  tag: find
  lens: security
  tell: The code follows a URL taken from an external response or from input while credentials are attached.
  asks: Is the host checked against an allowed list before the call?
- id: sensitive-in-output
  tag: find
  lens: security
  tell: A log line, error message or response carries a field.
  asks: "Can an unauthorized reader see personal data, secrets, internal IDs, or internal stack traces or class names?"
- id: injection-concat
  tag: find
  lens: security
  tell: "A query, command, template, or filter joins strings with input."
  asks: "Can input change the structure? Does a parameterized form exist?"
- id: path-from-input
  tag: find
  lens: security
  tell: "Code builds a file path or resource name from input."
  asks: "Does it normalize the result and check that it stays under the intended root?"
- id: secret-compare
  tag: find
  lens: security
  tell: A token, signature or password is compared with an ordinary equality check.
  asks: Does the comparison leak timing, and does the platform offer a constant-time compare?
- id: crash-on-external-input
  tag: find
  lens: security
  tell: "An assertion, unchecked unwrap, forced cast, or index uses a value from outside the process."
  asks: "Can input crash the request? Which validation would that skip?"
