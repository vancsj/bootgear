# Use the Converge angle schema. Use a unique kebab-case ID across all angle files.

- id: changed-contract
  tag: find
  tell: "A signature, return value, error, or behavior changes."
  asks: Which callers assume the old contract?
- id: removed-behavior
  tag: find
  tell: Lines or branches were deleted.
  asks: What relied on the removed behavior?
- id: new-input-path
  tag: find
  tell: A new parameter, endpoint or field accepts input.
  asks: Is it reachable with bad, empty or hostile input?
- id: failure-path
  tag: find
  tell: I/O, a retry or a multi-step write was added or changed.
  asks: What happens on a timeout or a partial write?
- id: shared-state
  tag: find
  tell: Mutable state, caching or ordering is involved.
  asks: Can a race or a stale read occur?
- id: boundary-input
  tag: find
  tell: A threshold, count or range is compared or computed.
  asks: What happens at 0, 1, empty, null and exactly the limit?
- id: absent-vs-default-field
  tag: find
  tell: A field is optional or defaulted.
  asks: Does the code tell "no" apart from "never answered"?
- id: gated-path
  tag: find
  tell: Behavior depends on a flag, environment variable or config value.
  asks: How does the change behave with the flag off?
- id: test-cant-fail
  tag: find
  tell: "The change adds or edits a test."
  asks: "Would the test fail with wrong code?"
- id: ticket-diff
  tag: find
  tell: A ticket is linked to the change.
  asks: "What work from the ticket does the diff omit? What work does the diff add beyond the ticket?"
- id: odd-old-code
  tag: find
  tell: The changed old code looked odd.
  asks: "Check `git log -S` and blame for the reason before removal."
- id: inverse-pr-text
  tag: find
  tell: The description claims a behavior.
  asks: "Reverse the claim. Does the diff still fit?"
- id: external-limits
  tag: find
  tell: "Changed code calls an external service with quotas, rate limits, or payload caps."
  asks: "Does the call meet documented limits at expected volume and payload size?"
- id: timing-env-dependent-test
  tag: find
  tell: A test sets a timeout, sleeps, or reads environment variables or machine state.
  asks: "Does it pass on slower machines or with different environment values? What sets the timeout?"
- id: new-throw-on-shared-path
  tag: find
  tell: "An existing method, interceptor, or aspect starts throwing a refusal, validation error, or exception."
  asks: "Which callers catch broadly or run in a transaction? What happens to each caller and transaction?"
