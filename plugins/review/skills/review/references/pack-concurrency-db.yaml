# use when: the project runs concurrent tasks, async or pooled workers, or uses a database with transactions
- id: cancellation-swallowed
  tag: find
  lens: correctness
  tell: A broad catch or handler wraps async or cancellable work.
  asks: "Does the handler suppress cancellation or interrupts so the work keeps running?"
- id: io-in-transaction
  tag: find
  lens: architecture
  tell: A network call, file write or queue send runs inside a database transaction.
  asks: "What holds the connection during the wait? What remains if the transaction rolls back after the call succeeds?"
  cost: "The pool runs out, or the external effect survives rollback."
- id: long-call-on-shared-pool
  tag: find
  lens: architecture
  tell: "A long or unbounded call runs on a shared pool or event loop."
  asks: "Can it block other work? Does the call have a dedicated, bounded pool?"
  cost: One slow call stalls unrelated requests.
