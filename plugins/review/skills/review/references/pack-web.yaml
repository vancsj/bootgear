# use when: the project serves HTTP endpoints, a web UI or a public API to external callers
- id: mass-assignment
  tag: find
  lens: security
  tell: A request body binds directly to a stored model, or accepts fields such as owner, role or status.
  asks: Can a caller set a field it must not control?
- id: protection-disabled
  tag: find
  lens: security
  tell: "Code disables CSRF, authentication, or origin checks, or uses a wildcard origin."
  asks: "Does the stated reason apply to every client that reaches the route?"
- id: debug-surface-exposed
  tag: find
  lens: security
  tell: "Code exposes a diagnostic, metrics, admin, or debug route."
  asks: Who can reach it without extra authentication, and what does it reveal?
- id: open-redirect
  tag: find
  lens: security
  tell: "Code builds a redirect target from request input."
  asks: "Does it check the target against an allowed list?"
- id: outlives-request
  tag: find
  lens: security
  tell: "A request handler starts a background task or callback."
  asks: "What identity does it use after the request context ends?"
