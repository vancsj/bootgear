cutoff:
  lenses:
    security:
      attack_if: [{reach: [normal, crafted]}]
      report_if: [{status: [survived, disputed], reach: [normal, crafted]}]
    correctness:
      attack_if: [{reach: [normal], impact: [security, data-loss, wrong-output]}, {reach: [normal], tier: [reproduced]}]
      report_if:
        - {status: [survived, disputed], reach: [normal], impact: [security, data-loss, wrong-output], size: [many]}
        - {status: [survived, disputed], reach: [normal], impact: [security, data-loss, wrong-output], rate_at_least: 3}
    contract:
      attack_if: [{reach: [normal]}]
      report_if: [{status: [survived, disputed], reach: [normal], impact: [security, data-loss, wrong-output, clarity]}]
      choice_if: [{difficulty: [cross-cutting, redesign]}]
    tests:
      attack_if: [{reach: [normal], impact: [security, data-loss, wrong-output]}, {tier: [reproduced, traced]}]
      report_if: [{status: [survived, disputed], reach: [normal], impact: [security, data-loss, wrong-output]}]
    architecture:
      attack_if: [{tier: [reproduced, traced], rate_at_least: 3}]
      report_if: [{status: [survived, disputed], tier: [reproduced, traced], rate_at_least: 3}]
    consistency:
      attack_if: [{tier: [reproduced, traced]}]
      report_if: [{status: [survived, disputed], tier: [reproduced, traced], impact: [security, data-loss, wrong-output, clarity]}]
  rereview:
    lenses:
      default: &strict
        attack_if: [{reach: [normal, crafted], impact: [security, data-loss, wrong-output], tier: [reproduced, traced]}]
        report_if:
          - {status: [survived, disputed], reach: [normal, crafted], impact: [security, data-loss]}
          - {status: [survived, disputed], reach: [normal], impact: [wrong-output], tier: [reproduced]}
      security: *strict
      correctness: *strict
      contract: *strict
      tests: *strict
      consistency: *strict
      architecture:
        attack_if: [{tier: [reproduced, traced], rate_at_least: 3}]
        report_if: [{status: [survived, disputed], tier: [reproduced], rate_at_least: 3}]
