# Add these consistency angles to the general angles. Cite each compared peer as file:line.

- id: peer-file-divergence
  tag: find
  lens: consistency
  tell: A new file, class, endpoint, migration or test sits beside others of the same kind.
  asks: "Compare two or three peers for names, errors, parameters, docs, registration, and tests. Cite each as file:line."
- id: sibling-in-file-divergence
  tag: find
  lens: consistency
  tell: "The change adds a function, block, or test beside peers in the same file."
  asks: "Does it differ from adjacent peers in style, timeouts, helpers, or assertions without reason? Cite each peer as file:line."
- id: name-fit
  tag: find
  lens: consistency
  tell: "The change adds a name or puts a different kind of content in a file or class."
  asks: "Does the name describe its responsibility? Do peers use the same term for the same thing?"
- id: unmarked-deliberate-oddity
  tag: find
  lens: consistency
  tell: "New code departs from the usual form on purpose, for example with a duplicate, magic value, or unusual comparison."
  asks: "Does a one-line comment explain intent? Could a later edit break it?"
- id: stale-doc-comment
  tag: find
  lens: consistency
  tell: Code changed under a comment or doc comment.
  asks: "Do the comment's names, defaults, parameters, returns, and errors still match the code?"
