# Architecture-fit angles. Use cost for the change or failure the design makes harder.
# Require a cost scenario.

- id: two-sources-of-truth
  tag: find
  lens: architecture-fit
  tell: "Two copies store or cache the same fact."
  asks: "Which copy wins if they disagree?"
  cost: "The copies diverge without detection."
- id: implicit-state-machine
  tag: find
  lens: architecture-fit
  tell: "Separate `if` statements scatter state transitions."
  asks: "What enforces legal transitions?"
  cost: "Code can write an illegal transition."
- id: partial-write
  tag: find
  lens: architecture-fit
  tell: A multi-step mutation has no transaction or up-front validation.
  asks: "What state remains if the process stops between steps?"
  cost: A crash leaves corrupt state.
- id: non-idempotent-retry
  tag: find
  lens: architecture-fit
  tell: A retry wraps a side effect.
  asks: "Is the side effect safe to repeat?"
  cost: "The retry duplicates a charge, email, or row."
- id: irreversible-migration
  tag: find
  lens: architecture-fit
  tell: A destructive change has no down path.
  asks: Can the change be rolled back without losing data?
  cost: A rollback loses data.
- id: invalid-states-representable
  tag: find
  lens: architecture-fit
  tell: "Fields form nullable pairs, or `status` and `errorMsg` can coexist."
  asks: "Can the type hold a forbidden combination?"
  cost: "Code must handle impossible combinations."
- id: no-timeout-backpressure
  tag: find
  lens: architecture-fit
  tell: "Code adds a network or queue call."
  asks: What bounds the wait and the backlog?
  cost: "A slow dependency blocks other work."
- id: config-sprawl
  tag: find
  lens: architecture-fit
  tell: A new flag or environment variable has no owner or removal plan.
  asks: "Who owns the setting? When can the owner remove it?"
  cost: "Tests miss setting combinations."
