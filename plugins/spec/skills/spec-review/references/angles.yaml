- id: request-criterion
  tag: find
  lens: request-fit
  tell: The request, confirmed intent, or acceptance criteria names an outcome, constraint, boundary, or stage.
  asks: Does the artifact preserve current intent? Check stale ticket assumptions and exclusions that prevent the
    requested result.
- id: missing-requirement
  tag: find
  lens: clarity-completeness
  tell: The artifact states a behavior or boundary without its necessary counterpart.
  asks: What required case, failure mode, or acceptance condition is absent?
- id: unresolved-term
  tag: find
  lens: clarity-completeness
  tell: The request or artifact uses an ambiguous domain term or interpretation.
  asks: Can implementation settle this without inventing a requirement?
- id: architecture-call
  tag: find
  lens: architecture-fit
  tell: The artifact changes a call path, boundary, relation, ownership, or state transition.
  asks: Trace affected callers, relation ownership, update/deletion rules, and side effects. Do they meet established
    contracts?
- id: architecture-choice
  tag: find
  lens: architecture-fit
  tell: The design changes architecture or introduces a new pattern.
  asks: Are minimal, clean, and pragmatic alternatives and relevant best practices considered?
- id: simpler-alternative
  tag: find
  lens: simplicity
  tell: The design adds a component, branch, field, or mechanism.
  asks: Is there a simpler clean way to implement the stated requirement?
- id: disproportionate-scope
  tag: find
  lens: proportionality
  tell: The artifact introduces scope not implied by the request.
  asks: Does this requirement or design overcomplicate the original request?
- id: unverifiable-outcome
  tag: find
  lens: testability
  tell: An acceptance condition or task needs verification of an observable outcome or boundary.
  asks: Inspect its fixture and assertion. Which plausible wrong result must fail? Check unchanged paths, event
    sequences, and verification limits.
- id: implied-requirement
  tag: find
  lens: clarity-completeness
  tell: The request implies a behavior, constraint or boundary the artifact does not state.
  asks: Which request sentence does it follow from (quote it), and does the stated outcome fail without it?
- id: design-assumption
  tag: find
  lens: architecture-fit
  tell: Any prose, diagram, table, or task assumes behaviour, configuration, a contract, or an exact representation.
  asks: Verify each assumption with evidence, including version, region, form, and configuration where relevant.
    Would failure invalidate requirements or architecture?
- id: whole-design-alternative
  tag: find
  lens: simplicity
  tell: The design as a whole is larger than the request needs.
  asks: What smaller design meets the same requirement, and where does this one differ?
- id: implementation-level
  tag: find
  lens: architecture-fit
  tell: A statement is sound but leaves a code-level detail open (naming, local structure, message text).
  asks: Can implementation choose this detail while keeping requirement and design contracts sound? Only then use
    the trigger prefix implementation-level:.
- id: value-lineage
  tag: find
  lens: architecture-fit
  tell: The artifact changes stored, copied, derived, overlaid, or similarly named values.
  asks: Trace origin, writers, storage, capture time, live/copy readers, and output. Does each required output use
    the intended source?
- id: lifecycle-composition
  tag: find
  lens: architecture-fit
  tell: Required behaviour depends on action sequences, ordering, reversals, later updates, recovery, dependencies,
    or caches.
  asks: Check invariants across allowed sequences. Does validation use the same effective state and order as application?
- id: request-quote
  tag: attack
  tell: The claim says authoritative intent requires or excludes something.
  asks: Quote the request or confirmed amendment. Does it support the claim within its current scope?
- id: settled-elsewhere
  tag: attack
  tell: The claim calls something missing or undecided.
  asks: Does another section of the artifact, or a recorded settlement, already answer it?
- id: negative-oracle
  tag: attack
  tell: The claim says an acceptance condition is insufficient or untestable.
  asks: Write a wrong implementation that still passes it. If one exists, the claim holds.
- id: wrong-outcome-test
  tag: attack
  tell: The claim says a requirement is implied.
  asks: Does the stated outcome fail without it?
- id: style-not-defect
  tag: attack
  tell: The claim is about wording or structure.
  asks: Would any reader or implementer behave differently under the two readings? If not, refute it.
