- id: report-claim
  tag: find
  lens: default
  tell: The triage report has a row in its `## Claims` table.
  asks: File each row as one cause claim, in row order, with tier reproduced. The claim id must equal the row id. Put the row command and output in the evidence.
- id: reproduction-rerun
  tag: attack
  tell: The claim quotes a reproduction command and its output.
  asks: Run the quoted command again. Does the observed output match the quoted output in substance? Do not compare exact strings. Put the command and the observed output in the evidence. If the command fails or the output does not match, record the attack as refuted.
