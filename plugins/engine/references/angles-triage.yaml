- id: report-claim
  tag: find
  lens: default
  tell: The triage report has a row in its `## Claims` table.
  asks: File one cause claim per row in order. Use the row ID and tier for the claim. Include its command and output.
- id: reproduction-rerun
  tag: attack
  tell: The claim quotes a reproduction command and output.
  asks: Rerun the command. Compare meaning. Include the command and actual output. Record the attack as refuted on failure or mismatch.
