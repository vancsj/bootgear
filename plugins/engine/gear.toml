[plugin]
name = "engine"

[commands.task]
exec = ["./bin/task"]

[commands.context-hook]
exec = ["python3", "hooks/pre_tool_use_task_identity.py", "--host", "claude"]

[reminders.after_compaction]
exec = ["python3", "hooks/session_start_recall.py"]
severity = "reminder"
order = 100
dedupe = "engine:after_compaction"
