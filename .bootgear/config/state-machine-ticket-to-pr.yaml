name: ticket-to-pr
description: Bootgear implementation workflow with evidence, review, and delivery gates.

nodes:
  clarify:
    reminder:
      do: "Settle the run with the clarify skill."
      leave: "The settlement is written to the run ledger and the goal is confirmed."
    next: [inspect]
  inspect:
    reminder:
      do: Inspect the ticket, relevant code, tests, contracts, and settled context; record the evidence before design.
        Record task-local investigation conclusions, checked boundaries and unresolved facts before drafting.
      leave: The relevant evidence, affected surfaces, and open unknowns are recorded in the run ledger.
      branches:
        spec: The evidence is sufficient to design the implementation.
    next:
    - spec
  spec:
    reminder:
      do: Draft requirements, design, and tasks with the public spec skill. Cite the request's acceptance criteria;
        record open interpretations and design choices without inventing answers. Form mental and conceptual models.
        Confirm only uncertain or materially changed models. Use five status sections in requirements and design.
        Complete bounded spec-stage self-review before handoff.
      leave: The primary package and author check are complete enough for independent spec review. Keep final sign-off
        with spec-review. The author checkpoint is clean or limit-reached; retain remaining caller work. For
        the inline exit to impl only, apply its approved patches and pass both gates with finder-written
        checks.
      branches:
        spec-review: The draft is ready for an independent correctness and completeness review.
        impl: A ready spec-review returned `inline` patches; they are applied and no new slate runs.
      exit_checks:
        impl:
          argv:
          - spec-feedback
          - gate
          - --task-folder
          - '{task_folder}'
          - --slate
          - '{slate}'
          - --converge-dir
          - '{converge_dir}'
          - --observations
          - '{observations}'
          - --checks
          - '{checks}'
    next:
    - spec-review
    - impl
  spec-review:
    max_visits: 5
    reminder:
      do: Run spec-review. Independently check request fit, clarity and completeness, architecture fit, best practices,
        simpler alternatives, proportionality, testability, and generic converge coverage; do not use the author transcript
        or another role's reasoning. Keep author hypotheses private. Receive complete primary artifacts, confirmed
        intent, raw evidence and standards. Give the finder raw observations; it writes independent checks, including
        explicit empty initial reports.
      leave: The independent review has complete coverage and its findings, evidence and choices are recorded. Record the
        revise, choices, inline, deferred, unchecked and follow_up lists. Only resumption at impl requires
        the full spec-feedback gate and normal converge gate with finder-written checks.
      exit_checks:
        impl:
          argv:
          - spec-feedback
          - gate
          - --task-folder
          - '{task_folder}'
          - --slate
          - '{slate}'
          - --converge-dir
          - '{converge_dir}'
          - --observations
          - '{observations}'
          - --checks
          - '{checks}'
      branches:
        spec: '`revise` is non-empty, or the review is ready with a non-empty `inline` list; carry the claim IDs,
          evidence and the `revise`, `choices`, `inline` and `deferred` lists back to spec.'
        spec-debate: '`choices` remain (carry the `revise`, `inline` and `deferred` lists along).'
        impl: '`revise`, `choices` and `inline` are empty.'
    next:
    - spec
    - spec-debate
    - impl
  spec-debate:
    reminder:
      do: "Apply debate_mode to the choice claims. In threshold mode, decide claims below debate_threshold solo, and resolve or debate claims at or above it. In mandatory mode, resolve every claim and debate only unresolved claims at or above debate_threshold. Record each decision. Update the artifacts."
      leave: "The decision is recorded in the run ledger and any change to the requirements or design is in the artifact; return through spec for re-review."
      branches:
        spec: "The decision is settled or changes the artifacts; return to spec and then spec-review."
    next: [spec]
  impl:
    reminder:
      do: Implement the reviewed design.
      leave: Every item in the task breakdown is implemented with its failing-first test recorded in the run ledger.
        Alternatively, a requirement or design gap has raw evidence and is ready for intake.
      branches:
        quality: The current work is complete and ready for the next validation step.
        spec-review: A requirement or design gap is recorded; public intake validates this destination within the
          authorized scope.
      exit_checks:
        spec-review:
          argv:
          - spec-feedback
          - intake
          - --task-folder
          - '{task_folder}'
          - --observations
          - '{observations}'
          - --destination
          - spec-review
    next:
    - quality
    - spec-review
  quality:
    reminder:
      do: "Run the repository quality baseline and record its real output with the public test skill."
      leave: "The quality command ran and its output is classified in the run ledger."
      branches:
        fix: "The quality baseline failed or exposed a required correction."
        test: "The quality baseline passed."
    next: [fix, test]
  test:
    reminder:
      do: "Run the relevant tests and record their real output with the public test skill."
      leave: "The relevant test command ran and its output is classified in the run ledger."
      branches:
        fix: "A relevant test failed or exposed a required correction."
        review: "The relevant tests passed and no host-path check is needed."
        runtime-check: "The tests passed and the change affects a host path requiring a fresh-session check."
    next: [fix, review, runtime-check]
  runtime-check:
    reminder:
      do: "Verify the affected plugin, hook, cache, or session path in a fresh host session and record the real event evidence."
      leave: "The fresh-session host path ran, or an applicable failure is recorded in the run ledger."
      branches:
        fix: "The fresh-session path failed or exposed a required correction."
        review: "The fresh-session path passed."
    next: [fix, review]
  fix:
    max_visits: 5
    reminder:
      do: Fix the failed check or accepted finding and record the diff. Preserve checkpoint counts; renew closed checkpoints
        only from related independent feedback. Check recurrence causes before another review. A sound-contract code
        defect follows the ordinary correction path. For a contract gap use public spec-feedback intake and the fixed
        feedback destination.
      leave: Every accepted claim id is applied or recorded as rejected, and the affected suite result is recorded
        in the run ledger. Alternatively, a requirement or design gap has raw evidence and is ready for intake.
      branches:
        quality: The current work is complete and ready for the next validation step.
        spec-review: A requirement or design gap is recorded; public intake validates this destination within the
          authorized scope.
      exit_checks:
        spec-review:
          argv:
          - spec-feedback
          - intake
          - --task-folder
          - '{task_folder}'
          - --observations
          - '{observations}'
          - --destination
          - spec-review
    next:
    - quality
    - spec-review
  review:
    max_visits: 5
    reminder:
      do: Review the change with /review; it runs converge on every finding. Keep author hypotheses private. Receive
        complete primary artifacts, confirmed intent, raw evidence and standards. On authoring paths, complete code-stage
        self-review before independent review or override delegation.
      leave: '`converge gate` exited 0 for this review''s slate and its render is recorded in the run ledger.'
      exit_checks:
        delivery:
          argv:
          - converge
          - gate
          - '{slate}'
          - --dir
          - '{converge_dir}'
      branches:
        review-debate: A finding or requested fix needs an above-threshold decision.
        fix: An accepted finding requires a correction.
        delivery: The review is clean or all permitted findings are resolved.
    next:
    - review-debate
    - fix
    - delivery
  review-debate:
    reminder:
      do: "Debate the choice claims from the review render with the public debate skill; factual disputes go back to /review."
      leave: "The decision is recorded in the run ledger with mode resolve or debate, and any required correction or further review pass is recorded with it."
      branches:
        fix: "The decision requires a correction."
        delivery: "The finding is settled without another correction."
    next: [fix, delivery]
  delivery:
    reminder:
      do: "Inspect the changed files; when a shipped plugin surface changed, bump its plugin.json version (bump both host manifests when shared engine behavior changed), then perform only the explicitly permitted delivery mutations and record each result."
      leave: "The permitted delivery scope, version-bump applicability and result, and actual mutation result are recorded in the run ledger."
      branches:
        succeeded: "All permitted delivery work is complete."
    next: [succeeded]
  succeeded:
    terminal: true
  failed:
    terminal: true

# Any node may transition to failed; this cross-cutting rule is not repeated
# in every node's next: list.
